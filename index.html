<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>✨ 随意 · 色彩漫游 ✨</title>
    <style>
        /* 全局重置 & 字体 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0b0f1f, #141a2b);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            padding: 1.5rem;
        }

        /* 主卡片 —— 玻璃质感 + 浮游动画 */
        .card {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            border-radius: 3.5rem 1.5rem 3.5rem 1.5rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
            padding: 2.8rem 2.2rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 215, 150, 0.15);
            animation: floatCard 6s infinite alternate ease-in-out;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px) rotate(0.5deg); }
            100% { transform: translateY(-12px) rotate(-0.5deg); }
        }

        /* 标题 —— 渐变霓虹 */
        .title {
            font-size: clamp(2.8rem, 12vw, 4.8rem);
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #f9e3b3, #ffb7c5, #b7dcff, #c3b1ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradShift 7s ease-in-out infinite alternate;
            text-shadow: 0 0 20px rgba(255, 200, 150, 0.2);
            margin-bottom: 0.3rem;
            line-height: 1.2;
        }

        @keyframes gradShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subhead {
            font-size: 1.3rem;
            color: rgba(255, 240, 220, 0.7);
            font-weight: 300;
            letter-spacing: 2px;
            border-left: 3px solid #f6b8b8;
            padding-left: 1rem;
            margin-bottom: 2rem;
            text-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        /* 内容网格 —— 灵活卡片区 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1.5rem;
            margin: 2.2rem 0 2.5rem;
        }

        .grid-item {
            background: rgba(30, 40, 60, 0.35);
            backdrop-filter: blur(4px);
            border-radius: 2.2rem 0.8rem 2.2rem 0.8rem;
            padding: 1.2rem 0.8rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s ease;
            box-shadow: 0 10px 18px -8px rgba(0, 0, 0, 0.3);
        }

        .grid-item:hover {
            transform: scale(1.03) translateY(-4px);
            background: rgba(50, 65, 95, 0.5);
            border-color: rgba(255, 210, 170, 0.3);
            box-shadow: 0 16px 28px -8px #00000066;
        }

        .grid-item .emoji-big {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 0.25rem;
            filter: drop-shadow(0 4px 6px #00000055);
        }

        .grid-item .label {
            font-weight: 500;
            color: #ece4d9;
            font-size: 1rem;
            letter-spacing: 0.5px;
            background: rgba(0,0,0,0.2);
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            display: inline-block;
            backdrop-filter: blur(2px);
        }

        /* 装饰引用区 — 随意诗句 */
        .quote-box {
            background: rgba(10, 15, 28, 0.5);
            border-radius: 3rem 0.8rem 3rem 0.8rem;
            padding: 1.8rem 1.8rem;
            margin: 1.8rem 0 2rem;
            border-left: 6px solid #ffb09c;
            box-shadow: 0 8px 18px rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
        }

        .quote-box p {
            font-size: 1.25rem;
            line-height: 1.6;
            color: #f2e9de;
            font-weight: 300;
            font-style: italic;
            text-shadow: 0 2px 4px #00000044;
        }

        .quote-box span {
            display: block;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #cfc1b0;
            text-align: right;
            font-style: normal;
            letter-spacing: 1px;
        }

        /* 底部按钮 + 小彩蛋 */
        .action-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-top: 0.8rem;
        }

        .btn {
            background: rgba(235, 215, 195, 0.1);
            border: 1px solid rgba(255, 215, 170, 0.25);
            backdrop-filter: blur(6px);
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 1.1rem;
            color: #f1e2d4;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255, 210, 170, 0.2);
            border-color: #ffc8a2;
            transform: scale(1.02);
            color: #fff8f0;
            box-shadow: 0 8px 20px #00000055;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-emoji {
            font-size: 1.4rem;
        }

        .footer-meta {
            font-size: 0.8rem;
            color: rgba(190, 180, 170, 0.6);
            letter-spacing: 1px;
            padding-top: 1.5rem;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 0.5rem;
        }

        /* 响应式微调 */
        @media (max-width: 500px) {
            .card { padding: 1.8rem 1.2rem; }
            .grid { grid-template-columns: 1fr 1fr; gap: 0.8rem; }
            .quote-box p { font-size: 1rem; }
        }

        /* 额外：动态粒子背景 (纯CSS小光点) */
        .particle-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle-bg span {
            position: absolute;
            display: block;
            width: 6px;
            height: 6px;
            background: rgba(255, 215, 180, 0.25);
            border-radius: 50%;
            box-shadow: 0 0 12px #ffb08c55;
            animation: drift 22s infinite alternate ease-in-out;
        }

        /* 随机生成20个光点 使用nth-child 分别定位 */
        .particle-bg span:nth-child(1) { left: 10%; top: 20%; animation-duration: 18s; width: 8px; height: 8px; background: #fbc4ab55; }
        .particle-bg span:nth-child(2) { left: 85%; top: 70%; animation-duration: 24s; width: 12px; height: 12px; background: #b7b8ff44; }
        .particle-bg span:nth-child(3) { left: 45%; top: 90%; animation-duration: 20s; width: 5px; height: 5px; }
        .particle-bg span:nth-child(4) { left: 22%; top: 65%; animation-duration: 26s; width: 10px; height: 10px; background: #f3d6a055; }
        .particle-bg span:nth-child(5) { left: 70%; top: 15%; animation-duration: 16s; width: 7px; height: 7px; }
        .particle-bg span:nth-child(6) { left: 5%; top: 45%; animation-duration: 30s; width: 14px; height: 14px; background: #b5d9ff33; }
        .particle-bg span:nth-child(7) { left: 92%; top: 40%; animation-duration: 19s; width: 9px; height: 9px; }
        .particle-bg span:nth-child(8) { left: 50%; top: 10%; animation-duration: 27s; width: 6px; height: 6px; background: #fccfcf55; }
        .particle-bg span:nth-child(9) { left: 33%; top: 33%; animation-duration: 21s; width: 11px; height: 11px; }
        .particle-bg span:nth-child(10) { left: 77%; top: 88%; animation-duration: 23s; width: 8px; height: 8px; background: #f6e3b3aa; }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            100% { transform: translate(40px, -60px) scale(1.6); opacity: 0.9; }
        }

        /* 保证内容在粒子之上 */
        .card, .particle-bg {
            position: relative;
            z-index: 2;
        }
        body {
            position: relative;
        }
    </style>
</head>
<body>
    <!-- 纯CSS粒子装饰（随意浮动） -->
    <div class="particle-bg" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- 主卡片 -->
    <main class="card" role="main">
        <h1 class="title">✦ 随 意 ✦</h1>
        <div class="subhead">· 漫无目的 · 色彩游荡 ·</div>

        <!-- 网格小卡片 —— 随意组合 -->
        <div class="grid">
            <div class="grid-item">
                <span class="emoji-big">🌈</span>
                <span class="label">光谱</span>
            </div>
            <div class="grid-item">
                <span class="emoji-big">🌀</span>
                <span class="label">律动</span>
            </div>
            <div class="grid-item">
                <span class="emoji-big">🌊</span>
                <span class="label">涟漪</span>
            </div>
            <div class="grid-item">
                <span class="emoji-big">✨</span>
                <span class="label">星尘</span>
            </div>
        </div>

        <!-- 引用区块 — 随意诗句 -->
        <div class="quote-box">
            <p>“允许一切发生，<br>像风穿过树林，像光漫过窗台。” </p>
            <span>—— 佚名 · 随意集</span>
        </div>

        <!-- 交互区域 + 彩蛋按钮 -->
        <div class="action-row">
            <button class="btn" id="randomColorBtn" aria-label="随机更换卡片强调色">
                <span class="btn-emoji">🎨</span> 换色
            </button>
            <button class="btn" id="quoteBtn" aria-label="随机显示一句小语">
                <span class="btn-emoji">💬</span> 絮语
            </button>
            <span style="font-size: 0.9rem; color: #a89788; opacity: 0.8; letter-spacing: 0.5px; background: rgba(0,0,0,0.2); padding: 0.2rem 1rem; border-radius: 30px;">
                ⚡ 随意点
            </span>
        </div>

        <!-- footer 小信息 -->
        <div class="footer-meta">
            ⚡ 纯 HTML · 随心而造 ⚡
        </div>
    </main>

    <!-- 简单的交互 JS （纯增强，无依赖） -->
    <script>
        (function() {
            "use strict";

            // 获取元素
            const card = document.querySelector('.card');
            const quoteBox = document.querySelector('.quote-box p');
            const quoteSpan = document.querySelector('.quote-box span');
            const randomBtn = document.getElementById('randomColorBtn');
            const quoteBtn = document.getElementById('quoteBtn');

            // 随机色板 (柔和)
            const colorPalette = [
                { border: '#f6b8b8', bg: 'rgba(255, 180, 160, 0.15)', shadow: '#f6b8b855' },
                { border: '#b8d9f6', bg: 'rgba(160, 200, 255, 0.12)', shadow: '#b8d9f655' },
                { border: '#c3b1ff', bg: 'rgba(180, 160, 255, 0.12)', shadow: '#c3b1ff55' },
                { border: '#f9e3b3', bg: 'rgba(245, 215, 160, 0.15)', shadow: '#f9e3b355' },
                { border: '#b3f0d9', bg: 'rgba(150, 230, 200, 0.12)', shadow: '#b3f0d955' },
                { border: '#ffb7c5', bg: 'rgba(255, 180, 190, 0.15)', shadow: '#ffb7c555' },
                { border: '#d4b8ff', bg: 'rgba(200, 170, 255, 0.12)', shadow: '#d4b8ff55' },
            ];

            // 随机絮语库
            const quotes = [
                { text: '“做一阵风，吹过就好，不必在意方向。”', author: '· 随想 ·' },
                { text: '“云朵从不计划自己的形状，却总是好看。”', author: '· 天空日记 ·' },
                { text: '“允许自己像一棵树，安静地站着，也随意地摇动。”', author: '· 自然集 ·' },
                { text: '“把今天过成一首没有标题的诗。”', author: '· 零碎 ·' },
                { text: '“色彩是世界的自言自语。”', author: '· 调色盘 ·' },
                { text: '“随性不是懒散，是给灵魂透气。”', author: '· 片刻 ·' },
                { text: '“像猫一样，在阳光里打盹，在月光下踱步。”', author: '· 慵懒哲学 ·' },
            ];

            // 当前索引 (用于轮换)
            let quoteIndex = 0;

            // 随机更换卡片强调色 (边框 + 左侧边框 + 阴影)
            function setRandomColor() {
                const randomIdx = Math.floor(Math.random() * colorPalette.length);
                const color = colorPalette[randomIdx];
                // 修改卡片边框 & 左border & 引用框左边框 & 按钮hover边框微调 (仅演示)
                card.style.borderColor = color.border;
                card.style.boxShadow = `0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px ${color.border} inset`;
                // 引用框左边框
                const quoteBoxEl = document.querySelector('.quote-box');
                if (quoteBoxEl) {
                    quoteBoxEl.style.borderLeftColor = color.border;
                    quoteBoxEl.style.boxShadow = `0 8px 18px rgba(0,0,0,0.3), 0 0 0 1px ${color.border}22 inset`;
                }
                // 子标题左边框 也调整
                const subhead = document.querySelector('.subhead');
                if (subhead) {
                    subhead.style.borderLeftColor = color.border;
                }
                // 小彩蛋：给按钮一个微弱边框变化
                document.querySelectorAll('.btn').forEach(btn => {
                    btn.style.borderColor = color.border + '66';
                });
            }

            // 更换絮语 (轮换 + 随机)
            function setRandomQuote() {
                // 随机选取一条，避免与当前相同 (简单处理)
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * quotes.length);
                } while (quotes.length > 1 && newIndex === quoteIndex);
                quoteIndex = newIndex;

                const selected = quotes[quoteIndex];
                if (quoteBox) {
                    quoteBox.textContent = selected.text;
                }
                if (quoteSpan) {
                    quoteSpan.textContent = selected.author;
                }
            }

            // 初始化: 随机一个颜色 + 随机一条quote
            function initRandom() {
                // 随机颜色
                const randomIdx = Math.floor(Math.random() * colorPalette.length);
                const color = colorPalette[randomIdx];
                card.style.borderColor = color.border;
                card.style.boxShadow = `0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px ${color.border} inset`;
                const quoteBoxEl = document.querySelector('.quote-box');
                if (quoteBoxEl) {
                    quoteBoxEl.style.borderLeftColor = color.border;
                    quoteBoxEl.style.boxShadow = `0 8px 18px rgba(0,0,0,0.3), 0 0 0 1px ${color.border}22 inset`;
                }
                const subhead = document.querySelector('.subhead');
                if (subhead) {
                    subhead.style.borderLeftColor = color.border;
                }
                document.querySelectorAll('.btn').forEach(btn => {
                    btn.style.borderColor = color.border + '66';
                });

                // 随机初始絮语
                const initQuoteIdx = Math.floor(Math.random() * quotes.length);
                quoteIndex = initQuoteIdx;
                const initQuote = quotes[initQuoteIdx];
                if (quoteBox) {
                    quoteBox.textContent = initQuote.text;
                }
                if (quoteSpan) {
                    quoteSpan.textContent = initQuote.author;
                }
            }

            // 绑定事件
            if (randomBtn) {
                randomBtn.addEventListener('click', setRandomColor);
            }
            if (quoteBtn) {
                quoteBtn.addEventListener('click', setRandomQuote);
            }

            // 执行一次初始化
            initRandom();

            // 额外：双击卡片小彩蛋 (重置为更随意的组合)
            card.addEventListener('dblclick', function(e) {
                // 同时更换颜色 + 絮语
                setRandomColor();
                setRandomQuote();
                // 微反馈：卡片闪一下
                card.style.transition = 'all 0.08s ease';
                card.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    card.style.transform = '';
                }, 100);
            });

        })();
    </script>

</body>
</html>
